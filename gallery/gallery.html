    </figure>
    <figure class="polaroid" data-full="images/photo2-sih.jpg">

      <figcaption>SIH 2025 · Sentinel AI 🏆</figcaption>
    </figure>
    <figure class="polaroid" data-full="images/photo3-profile.jpg">
      <img src="images/photo3-profile.jpg" alt="Mayur profile photo" loading="lazy" style="object-position:center 25%">
      <figcaption>Mayur · AI/ML Explorer 🚀</figcaption>
    </figure>
    <figure class="polaroid" data-full="images/photo4-campus.jpg">
      <img src="images/photo4-campus.jpg" alt="Mayur on college campus" loading="lazy" style="object-position:center 20%">

    </figure>

      <figcaption>Stage Time &amp; Anchoring 🎤</figcaption>
    </figure>
    <figure class="polaroid" data-full="images/photo6-fest.jpg">
      <img src="images/photo6-fest.jpg" alt="Mayur at college fest concert night" loading="lazy" style="object-position:center 20%">
      <figcaption>Fest Vibes &amp; Lights ⚡</figcaption>
    </figure>
  </div>
  <div class="btns" style="justify-content:center;margin-top:2.2rem">
    <a class="btn alt" href="../index.html#gallery">← Back to portfolio</a>
  </div>
</div></div>

<!-- Lightbox Modal for Gallery -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo preview">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close photo">✕</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Enlarged photo">
    <p class="lightbox-caption" id="lightboxCaption"></p>

</div>
